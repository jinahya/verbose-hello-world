# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master", "develop", "sketch" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=jinahya_verbose-hello-world
        run: mvn -B install org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=jinahya_verbose-hello-world
      - name: cdi-se-openwebbeans
        run: mvn -Pcdi-se-openwebbeans -pl 02-verbose-hello-world-lib test
      - name: cdi-se-openwebbeans-junit5
        run: mvn -Pcdi-se-openwebbeans-junit5 -pl 02-verbose-hello-world-lib test
      - name: cdi-se-weld
        run: mvn -Pcdi-se-weld -pl 02-verbose-hello-world-lib test
      - name: cdi-se-weld-junit5
        run: mvn -Pcdi-se-weld-junit5 -pl 02-verbose-hello-world-lib test
      - name: di-dagger
        run: mvn -Pdi-dagger -pl 02-verbose-hello-world-lib test
      - name: di-guice
        run: mvn -Pdi-guice -pl 02-verbose-hello-world-lib test
      - name: di-hk2
        run: mvn -Phk2 -pl 02-verbose-hello-world-lib test
      - name: di-spring
        run: mvn -Pspring -pl 02-verbose-hello-world-lib test

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
